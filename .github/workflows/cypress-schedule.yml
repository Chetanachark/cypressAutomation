name: Cypress Regression Pipeline

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours

  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    # ✅ FIX ADDED HERE (important for crypto / openssl issues)
    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:

      # 1️⃣ Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.16.0

      # 3️⃣ Cache npm
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 4️⃣ Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 5️⃣ Clean reports
      - name: Clean old reports
        run: npm run clean:reports

      # 6️⃣ Run Cypress tests
      - name: Run Cypress Tests
        run: npm run cy:run

      # 7️⃣ Merge reports
      - name: Merge Mochawesome Reports
        run: npm run mocha:merge

      # 8️⃣ Generate HTML report
      - name: Generate HTML Report
        run: npm run mocha:report

      # 9️⃣ Generate summary
      - name: Generate Summary
        run: npm run summary

      # 🔟 Upload artifacts
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos